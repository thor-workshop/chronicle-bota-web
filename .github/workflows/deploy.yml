# GitHub Pages 배포. 저장소 설정 › Pages › Source 가 「GitHub Actions」여야 한다.
name: Deploy to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      # 하나라도 실패하면 올리지 않는다
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check-korean
      - run: npm run check-fonts
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
